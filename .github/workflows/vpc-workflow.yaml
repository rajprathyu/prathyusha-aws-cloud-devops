name: Terraform AWS Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "**.tf"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check AWS role variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "ERROR: AWS_ROLE_ARN repository variable is missing."
            exit 1
          fi

          if [[ "$AWS_ROLE_ARN" != arn:aws:iam::*:role/* ]]; then
            echo "ERROR: AWS_ROLE_ARN must contain the complete IAM role ARN."
            exit 1
          fi

          echo "AWS role ARN format looks correct."
      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);

    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        wiith:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=falsie
